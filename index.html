<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayGrid - Matchmaking sportif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111827; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased pb-24 selection:bg-orange-500 selection:text-white">

    <script>
        // --- 1. CONNEXION SUPABASE ---
        const SUPABASE_URL = 'https://elrimadnclaawodmrsam.supabase.co/';
        const SUPABASE_KEY = 'sb_publishable_uW0oG_fEhbn5IKlhnplj7g_XQL-MbJW';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        // --- 2. GESTION DE L'AUTHENTIFICATION ---
        client.auth.onAuthStateChange((event, session) => {
            const authScreen = document.getElementById('screen-auth');
            if (session) {
                currentUser = session.user;
                authScreen.classList.add('hidden'); 
                chargerParties(); 
            } else {
                currentUser = null;
                authScreen.classList.remove('hidden'); 
                document.getElementById('feed-parties').innerHTML = ''; 
            }
        });

        async function creerCompte() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert("Veuillez remplir l'email et le mot de passe.");
            
            const btn = document.getElementById('btn-register');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création...';
            
            const { data, error } = await client.auth.signUp({ email: email, password: password });
            
            btn.innerHTML = 'Créer un compte';
            if (error) alert("❌ Erreur : " + error.message);
        }

        async function seConnecter() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert("Veuillez remplir l'email et le mot de passe.");
            
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
            
            const { data, error } = await client.auth.signInWithPassword({ email: email, password: password });
            
            btn.innerHTML = 'Se connecter';
            if (error) alert("❌ Identifiants incorrects.");
        }

        async function seDeconnecter() {
            await client.auth.signOut();
        }

        // --- 3. GESTION DU MENU ET DES PARTIES ---
        function toggleModal() {
            const modal = document.getElementById('modal-organiser');
            modal.classList.toggle('hidden');
        }

        async function creerPartie() {
            const sport = document.getElementById('input-sport').value;
            const date = document.getElementById('input-date').value;
            const time = document.getElementById('input-time').value;
            const lieu = document.getElementById('input-lieu').value;
            const whatsapp = document.getElementById('input-whatsapp').value;
            const waze = document.getElementById('input-waze').value;
            const validationManuelle = document.getElementById('input-validation').checked;

            if(!date || !time || !lieu) return alert("⚠️ Veuillez remplir la date, l'heure et le lieu.");

            const gameTime = new Date(`${date}T${time}:00`).toISOString();
            const notesData = `Validation: ${validationManuelle ? 'Oui' : 'Non'} | WhatsApp: ${whatsapp} | Waze: ${waze}`;

            const btn = document.getElementById('btn-creer');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création...';

            const { data, error } = await client.from('games').insert([
                { host_id: currentUser.id, activity_type: sport, location_name: lieu, game_time: gameTime, players_needed: 3, notes: notesData }
            ]);

            btn.innerHTML = 'Créer la partie';
            if (error) {
                alert("❌ Erreur : " + error.message);
            } else {
                toggleModal();
                document.getElementById('form-creation').reset();
                chargerParties(); 
            }
        }

        // --- 4. REJOINDRE UNE PARTIE ---
        async function rejoindrePartie(gameId, btnElement) {
            if (!currentUser) return;

            btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';
            btnElement.disabled = true;

            const { data, error } = await client.from('game_participants').insert([
                { game_id: gameId, player_id: currentUser.id }
            ]);

            if (error) {
                if (error.code === '23505' || error.message.includes('unique')) {
                    btnElement.innerHTML = 'Déjà demandé';
                    btnElement.className = 'w-full bg-gray-100 border border-gray-300 text-gray-500 font-bold py-3.5 rounded cursor-not-allowed';
                } else {
                    alert("❌ Erreur : " + error.message);
                    btnElement.innerHTML = 'Demander à rejoindre';
                    btnElement.disabled = false;
                }
            } else {
                btnElement.innerHTML = '✅ Demande envoyée';
                btnElement.className = 'w-full bg-white border-2 border-black text-black font-bold py-3.5 rounded cursor-not-allowed';
            }
        }

        // --- 5. CHARGEMENT DES PARTIES EN DIRECT ---
        async function chargerParties() {
            const feed = document.getElementById('feed-parties');
            feed.innerHTML = '<div class="text-center text-black py-10"><i class="fas fa-circle-notch fa-spin text-4xl mb-4"></i></div>';

            const { data, error } = await client.from('games').select('*').order('game_time', { ascending: true });

            if (error) return feed.innerHTML = `<p class="text-red-500 font-bold p-4 border border-red-200 bg-red-50">Erreur: ${error.message}</p>`;
            if (!data || data.length === 0) return feed.innerHTML = '<div class="border border-gray-200 rounded p-8 text-center text-gray-500 font-medium">Aucune partie prévue.</div>';

            feed.innerHTML = ''; 
            data.forEach(partie => {
                let emoji = '🏅';
                if(partie.activity_type.toLowerCase().includes('foot')) emoji = '⚽';
                if(partie.activity_type.toLowerCase().includes('padel')) emoji = '🎾';
                if(partie.activity_type.toLowerCase().includes('jeux')) emoji = '🎲';
                if(partie.activity_type.toLowerCase().includes('basket')) emoji = '🏀';

                const dateObj = new Date(partie.game_time);
                const heureStr = dateObj.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });

                const cardHTML = `
                    <div class="bg-white rounded p-5 border border-gray-200 relative mb-4">
                        <div class="absolute top-0 right-0 bg-orange-500 text-white text-[10px] uppercase tracking-wider font-black px-3 py-1.5 rounded-bl">
                            Il manque ${partie.players_needed} joueurs
                        </div>
                        <div class="flex items-center gap-4 mb-5 mt-1">
                            <div class="w-14 h-14 bg-gray-50 rounded flex items-center justify-center text-2xl border border-gray-200 text-black">
                                ${emoji}
                            </div>
                            <div>
                                <h3 class="font-black text-xl text-black uppercase tracking-tight">${partie.activity_type}</h3>
                                <p class="text-gray-500 text-sm font-semibold mt-0.5"><i class="far fa-clock mr-1"></i> ${dateStr} à ${heureStr}</p>
                            </div>
                        </div>
                        <div class="flex items-center text-sm text-gray-700 mb-5 bg-gray-50 p-3 rounded border border-gray-200">
                            <i class="fas fa-map-marker-alt w-6 text-center text-black"></i> 
                            <span class="font-bold">${partie.location_name}</span>
                        </div>
                        <button onclick="rejoindrePartie('${partie.id}', this)" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3.5 rounded transition duration-200">
                            Demander à rejoindre
                        </button>
                    </div>
                `;
                feed.insertAdjacentHTML('beforeend', cardHTML);
            });
        }
    </script>

    <!-- ÉCRAN D'AUTHENTIFICATION -->
    <div id="screen-auth" class="fixed inset-0 bg-white z-50 flex flex-col justify-center px-6">
        <div class="max-w-md mx-auto w-full">
            <div class="text-center mb-10">
                <h1 class="text-5xl font-black text-black tracking-tighter mb-3 uppercase">PlayGrid<span class="text-orange-500">.</span></h1>
                <p class="text-gray-500 font-medium">Structurez vos parties. Trouvez vos joueurs.</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Email</label>
                    <input type="email" id="auth-email" placeholder="joueur@email.com" class="w-full bg-gray-50 border border-gray-200 rounded p-4 text-black focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Mot de passe</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded p-4 text-black focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition">
                </div>
                
                <div class="pt-4 space-y-3">
                    <button id="btn-login" onclick="seConnecter()" class="w-full bg-black hover:bg-gray-800 text-white font-bold text-lg py-4 rounded transition">
                        Se connecter
                    </button>
                    <button id="btn-register" onclick="creerCompte()" class="w-full bg-white border-2 border-black hover:bg-gray-50 text-black font-bold text-lg py-4 rounded transition">
                        Créer un compte
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- En-tête de l'application -->
    <header class="bg-white border-b border-gray-200 p-4 sticky top-0 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-black tracking-tighter uppercase">PlayGrid<span class="text-orange-500">.</span></h1>
            <button onclick="seDeconnecter()" class="w-10 h-10 bg-white rounded flex items-center justify-center border border-gray-200 hover:border-black text-black transition" title="Se déconnecter">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-md mx-auto p-4 mt-2">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-3xl font-black tracking-tighter text-black uppercase">Flux</h2>
                <p class="text-gray-500 text-sm mt-1 font-medium">Casablanca & Environs</p>
            </div>
            <button class="bg-white p-2.5 rounded text-black border border-gray-200 hover:border-black transition"><i class="fas fa-filter"></i></button>
        </div>

        <div class="flex gap-2.5 overflow-x-auto pb-4 mb-4 scrollbar-hide">
            <button class="px-5 py-2 bg-black text-white font-bold rounded whitespace-nowrap">Tout</button>
            <button class="px-5 py-2 bg-white text-gray-600 font-bold rounded whitespace-nowrap border border-gray-200 hover:border-black hover:text-black transition">🎾 Padel</button>
            <button class="px-5 py-2 bg-white text-gray-600 font-bold rounded whitespace-nowrap border border-gray-200 hover:border-black hover:text-black transition">⚽ Football</button>
        </div>

        <div id="feed-parties" class="space-y-4 pb-12"></div>
    </main>

    <!-- MODAL "ORGANISER UNE PARTIE" -->
    <div id="modal-organiser" class="hidden fixed inset-0 bg-gray-900/40 z-50 flex flex-col justify-end backdrop-blur-sm transition-all">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-xl p-6 h-[85vh] overflow-y-auto border-t border-gray-200 relative">
            <button onclick="toggleModal()" class="absolute top-5 right-5 text-gray-400 hover:text-black text-2xl w-8 h-8 rounded flex items-center justify-center transition"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-black mb-6 text-black tracking-tighter uppercase">Nouveau Match</h2>
            
            <form id="form-creation" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Activité</label>
                    <select id="input-sport" class="w-full bg-white border border-gray-200 rounded p-4 text-black font-bold focus:outline-none focus:border-black focus:ring-1 focus:ring-black">
                        <option value="Padel">🎾 Padel</option>
                        <option value="Football">⚽ Football</option>
                        <option value="Jeux de société">🎲 Jeux de société</option>
                    </select>
                </div>

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Date</label>
                        <input type="date" id="input-date" class="w-full bg-white border border-gray-200 rounded p-4 text-black font-bold focus:outline-none focus:border-black focus:ring-1 focus:ring-black">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Heure</label>
                        <input type="time" id="input-time" class="w-full bg-white border border-gray-200 rounded p-4 text-black font-bold focus:outline-none focus:border-black focus:ring-1 focus:ring-black">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Lieu exact</label>
                    <input type="text" id="input-lieu" placeholder="Ex: Oasis Club" class="w-full bg-white border border-gray-200 rounded p-4 text-black font-bold mb-2 focus:outline-none focus:border-black focus:ring-1 focus:ring-black">
                    <input type="url" id="input-waze" placeholder="Lien Waze/Maps (Optionnel)" class="w-full bg-gray-50 border border-gray-200 rounded p-4 text-sm text-gray-600 focus:outline-none focus:border-black focus:ring-1 focus:ring-black">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Lien d'invitation WhatsApp</label>
                    <input type="url" id="input-whatsapp" placeholder="https://chat.whatsapp.com/..." class="w-full bg-white border border-gray-200 border-l-4 border-l-black rounded p-4 text-black font-bold focus:outline-none focus:border-black focus:ring-1 focus:ring-black">
                </div>

                <div class="bg-gray-50 border border-gray-200 p-4 rounded flex items-center justify-between mt-2">
                    <div>
                        <h4 class="font-bold text-black text-sm uppercase tracking-tight">Validation Manuelle</h4>
                        <p class="text-xs text-gray-500 mt-1 font-medium">Acceptez les profils avant de partager le lieu.</p>
                    </div>
                    <input type="checkbox" id="input-validation" class="w-5 h-5 accent-black border-gray-300 rounded" checked>
                </div>

                <button type="button" id="btn-creer" onclick="creerPartie()" class="w-full bg-black hover:bg-gray-800 text-white font-bold text-lg py-4 rounded mt-6 transition">
                    Valider le match
                </button>
            </form>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 pb-safe z-30">
        <div class="max-w-md mx-auto flex justify-around p-2">
            <button class="text-black flex flex-col items-center p-2 w-16"><i class="fas fa-layer-group text-xl mb-1"></i><span class="text-[10px] font-black uppercase tracking-widest">Feed</span></button>
            <button onclick="toggleModal()" class="text-gray-400 hover:text-black flex flex-col items-center p-2 w-16 transition">
                <div class="bg-black text-white w-12 h-12 rounded flex items-center justify-center"><i class="fas fa-plus text-xl"></i></div>
            </button>
            <button class="text-gray-400 hover:text-black flex flex-col items-center p-2 w-16 transition"><i class="fas fa-comment-alt text-xl mb-1"></i><span class="text-[10px] font-black uppercase tracking-widest">Chat</span></button>
        </div>
    </nav>
</body>
</html>
